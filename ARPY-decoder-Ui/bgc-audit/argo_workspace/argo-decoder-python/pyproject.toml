[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "argo-decoder"
version = "0.1.0a0"
description = "Coriolis Argo float real-time decoder (Python reference implementation)"
readme = "README.md"
license = { text = "CC0-1.0" }
requires-python = ">=3.11"
authors = [
    { name = "Coriolis / Euro-Argo Decoder Migration Team" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "structlog>=24,<25",
    "xarray>=2024.3",
    "netCDF4>=1.6,<2",
    "h5netcdf>=1.3",
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "lxml>=5,<6",
    "cf-xarray>=0.9",
    "rich>=13,<14",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
gsw = ["gsw>=3.6"]
dask = ["dask>=2024.4", "distributed>=2024.4"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
oracle-docker = ["docker>=7.0"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "pytest-xdist>=3,<4",
    "hypothesis>=6.100",
    "pytest-datadir>=1.5",
    "mypy>=1.10",
    "basedpyright>=1.14",
    "ruff>=0.5,<1",
    "pip-audit>=2.7",
    "towncrier>=24,<25",
    "mkdocs-material>=9,<10",
    "mkdocstrings[python]>=0.25",
    "pytest-json-report>=1.5",
    "types-PyYAML>=6.0",
]

[project.scripts]
argo-decoder = "argo_decoder.cli.main:app"

[project.urls]
Homepage = "https://github.com/euroargodev/Coriolis-data-processing-chain-for-Argo-floats-container"
Repository = "https://github.com/euroargodev/Coriolis-data-processing-chain-for-Argo-floats-container"

[tool.hatch.build.targets.wheel]
packages = ["src/argo_decoder"]

[tool.hatch.build.targets.wheel.force-include]
"src/argo_decoder/config/decoder_table.yaml" = "argo_decoder/config/decoder_table.yaml"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "pytest-xdist>=3,<4",
    "hypothesis>=6.100",
    "pytest-datadir>=1.5",
    "mypy>=1.10",
    "ruff>=0.5,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM",
    "RUF",
]
ignore = [
    # Phase 0: we do not yet enforce the full pydocstyle suite. Stricter docstring
    # rules (D1xx/D2xx/D4xx) will be enabled as we build out modules.
    "D",
    "SIM105",
    "B008",  # Typer Arguments/Options at function defaults are intentional.
]

[tool.ruff.lint.isort]
known-first-party = ["argo_decoder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    "tests/",
]
[[tool.mypy.overrides]]
module = [
    "netCDF4",
    "h5netcdf",
    "cf_xarray",
    "lxml",
    "rich",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
log_cli_level = "INFO"
markers = [
    "unit: unit tests (fast, no IO)",
    "integration: integration tests (local IO)",
    "golden: golden dataset comparison tests",
    "slow: slow-running tests",
    "docker: requires docker and oracle image",
]

[tool.coverage.run]
source = ["argo_decoder"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]
